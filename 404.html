<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --ink:#f3f1ea; --ink-dim:#9a9994; --violet:#6c4cff; --violet-soft:#8b6fff; --line:rgba(245,245,241,.09);
    --ff-display:'Fraunces',serif; --ff-head:'Space Grotesk',sans-serif; --ff-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--ff-body);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px;}
  a{color:inherit; text-decoration:none;}
  .code{font-family:var(--ff-display); font-style:italic; font-size:clamp(80px,18vw,180px); color:var(--violet-soft); line-height:1; margin:0;}
  h1{font-family:var(--ff-head); text-transform:uppercase; font-size:clamp(20px,3vw,28px); margin:14px 0 10px;}
  p{color:var(--ink-dim); max-width:420px; margin:0 0 32px;}
  .btn{font-family:var(--ff-head); font-weight:600; font-size:14px; text-transform:uppercase; letter-spacing:.02em;
    padding:15px 26px; border-radius:2px; background:var(--violet); color:#fff; transition:.3s;}
  .btn:hover{background:var(--violet-soft); transform:translateY(-2px);}
</style>
</head>
<body>
  <p class="code">404</p>
  <h1>This frame doesn't exist.</h1>
  <p>The page you're looking for may have been moved or the link may be out of date.</p>
  <a href="/index.html" class="btn">Back to Home</a>
</body>
</html>
